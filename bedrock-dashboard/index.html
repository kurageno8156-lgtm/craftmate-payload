<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockWhiz Bedrock</title>
<style>
:root{--bg:#0b0f14;--panel:#141b24;--border:#26303c;--text:#dfe7ef;--muted:#8a98a8;--accent:#5aa9ff;--ok:#4ade80;--err:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
h1{font-size:16px;margin:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--err)}.dot.on{background:var(--ok)}
nav{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
nav button{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer}
nav button.active{color:var(--text);border-color:var(--accent);background:#16222f}
main{padding:20px;max-width:1100px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv{color:var(--muted);font-size:12px}.kv b{color:var(--text);font-weight:600}
button.act{background:var(--accent);color:#08111c;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600}
button.act:disabled{opacity:.5;cursor:default}
button.ghost{background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
input,select{background:#0e141b;border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
#log{background:#060a0f;border:1px solid var(--border);border-radius:6px;height:340px;overflow-y:auto;padding:10px;font:12px/1.6 Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}.msg.err{background:#3a1418;color:#fca5a5}.msg.ok{background:#12351f;color:#86efac}
.hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><h1>BlockWhiz Bedrock</h1><span id="dot" class="dot"></span><span id="status" class="hint">connecting…</span></header>
<nav id="nav"></nav>
<main id="view"></main>
<script>
const $=s=>document.querySelector(s),view=$('#view');
const TABS=['ダッシュボード','チャット','プレイヤー','ワールド','設定','アップデート'];
let st={running:false,pid:null,bdsDir:'',exeExists:false,worldExists:false};
let curTab='ダッシュボード';
function msg(t,ok){const d=document.createElement('div');d.className='msg '+(ok?'ok':'err');d.textContent=t;view.prepend(d);setTimeout(()=>d.remove(),6000)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function refresh(){st=await bedrock.status();$('#dot').className='dot'+(st.running?' on':'');$('#status').textContent=st.running?`running pid=${st.pid}`:'stopped';render()}
function renderNav(){ $('#nav').innerHTML=TABS.map(t=>`<button class="${t===curTab?'active':''}" data-t="${t}">${t}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;render()}); }
function btnStart(){return `<button class="act" id="bStart" ${st.running?'disabled':''}>サーバー起動</button>`}
function btnStop(){return `<button class="act" id="bStop" ${st.running?'':'disabled'} style="background:#f87171;color:#1a0505">サーバー停止</button>`}
function render(){renderNav();
  if(curTab==='ダッシュボード')view.innerHTML=`
    <div class="panel"><h3>サーバー状態</h3><div class="grid">
      <div class="kv">状態<b id="kvState">${st.running?'起動中':'停止中'}</b></div>
      <div class="kv">PID<b>${st.pid||'-'}</b></div>
      <div class="kv">BDSパス<b style="font-size:11px;word-break:break-all">${esc(st.bdsDir)}</b></div>
      <div class="kv">bedrock_server.exe<b>${st.exeExists?'あり':'なし'}</b></div>
      <div class="kv">worlds<b>${st.worldExists?'あり':'なし'}</b></div>
    </div><div class="row" style="margin-top:14px">${btnStart()}${btnStop()}
      <button class="ghost" id="bDir">BDSフォルダを選択</button></div></div>
    <div class="panel"><h3>サーバーログ</h3><div id="log"></div></div>`;
  else if(curTab==='チャット')view.innerHTML=`
    <div class="panel"><h3>コマンド送信（BDS標準入力）</h3>
      <div class="row"><input id="cmd" placeholder="例: say Hello / list / kick player / op player" />
      <button class="act" id="bCmd" ${st.running?'':'disabled'}>送信</button></div>
      <p class="hint">BDSのコンソールコマンドをそのまま送信します。say / list / kick / ban / op / deop / whitelist 等が使えます。</p></div>
    <div class="panel"><h3>ログ</h3><div id="log"></div></div>`;
  else if(curTab==='プレイヤー')view.innerHTML=`
    <div class="panel"><h3>オンライン操作</h3>
      <div class="row"><input id="pcmd" placeholder="list / kick <name> / ban <name> / op <name>" />
      <button class="act" id="bPCmd" ${st.running?'':'disabled'}>実行</button></div></div>
    <div class="panel"><h3>ops.json（オペレーター）</h3><div id="ops"></div></div>
    <div class="panel"><h3>allowlist.json（許可リスト）</h3><div id="allow"></div></div>`;
  else if(curTab==='ワールド')view.innerHTML=`
    <div class="panel"><h3>ワールド情報</h3>
      <div class="kv">worlds フォルダ<b>${st.worldExists?'存在':'未作成（初回起動時に生成）'}</b></div>
      <div class="kv">BDSパス<b style="font-size:11px;word-break:break-all">${esc(st.bdsDir)}</b></div></div>
    <div class="panel"><h3>バックアップ</h3>
      <div class="row"><button class="act" id="bBak" ${st.running?'disabled':''}>バックアップ作成</button>
      <button class="ghost" id="bBakList">一覧更新</button></div>
      <div id="baks" style="margin-top:10px"></div></div>
    <div class="panel"><h3>復元</h3>
      <div class="row"><select id="bSel"><option value="">バックアップを選択</option></select>
      <button class="ghost" id="bRestore" ${st.running?'disabled':''}>復元実行</button></div>
      <p class="hint">復元はBDS停止中のみ。現在のworldsは .pre-restore-* に退避されます。</p></div>`;
  else if(curTab==='設定')view.innerHTML=`
    <div class="panel"><h3>server.properties</h3><div id="props" class="hint">読み込み中…</div>
      <div class="row" style="margin-top:10px"><button class="act" id="bPropsSave">保存</button>
      <button class="ghost" id="bPropsReload">再読み込み</button></div></div>`;
  else if(curTab==='アップデート')view.innerHTML=`
    <div class="panel"><h3>アプリバージョン</h3><div class="kv">BlockWhiz Bedrock<b id="ver">-</b></div>
      <div class="row" style="margin-top:12px"><button class="act" id="bVer">最新バージョンを確認</button></div>
      <div id="verRes" style="margin-top:10px"></div></div>
    <div class="panel"><h3>BDSバージョン</h3><div class="kv">bedrock_server<b>${st.exeExists?'インストール済み':'未検出'}</b></div>
      <p class="hint">BDS本体の更新は公式サイトから手動で入手してください。このアプリはBDSの起動・管理のみ行います。</p></div>`;
  bind();
  if(curTab==='ダッシュボード'||curTab==='チャット')loadLogs();
  if(curTab==='プレイヤー'){loadJson('ops.json','ops','オペレーター');loadJson('allowlist.json','allow','許可リスト');}
  if(curTab==='ワールド'){loadBaks();}
  if(curTab==='設定'){loadProps();}
}
function bind(){
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};
  on('bStart',async()=>{const r=await bedrock.start();msg(r.ok?'BDSを起動しました':'起動失敗: '+(r.error||''),r.ok);refresh()});
  on('bStop',async()=>{const r=await bedrock.stop();msg(r.ok?'停止を送信しました':'停止失敗: '+(r.error||''),r.ok);setTimeout(refresh,1500)});
  on('bDir',async()=>{const r=await bedrock.pickBdsDir();if(r.ok){msg('BDSフォルダ: '+r.dir,true);refresh()}});
  on('bCmd',async()=>{const v=$('#cmd').value.trim();if(!v)return;const r=await bedrock.cmd(v);if(!r.ok)msg(r.error,false);$('#cmd').value=''});
  on('bPCmd',async()=>{const v=$('#pcmd').value.trim();if(!v)return;const r=await bedrock.cmd(v);if(!r.ok)msg(r.error,false);$('#pcmd').value='';setTimeout(loadLogs,500)});
  on('bBak',async()=>{const r=await bedrock.backupCreate();msg(r.ok?'バックアップ作成: '+r.path:'失敗: '+r.error,r.ok);loadBaks()});
  on('bBakList',loadBaks);
  on('bRestore',async()=>{const n=$('#bSel').value;if(!n)return confirm('復元しますか？現在のworldsは退避されます。')&&(async()=>{const r=await bedrock.backupRestore(n);msg(r.ok?'復元しました':'失敗: '+r.error,r.ok)})()});
  on('bPropsSave',async()=>{const props={};document.querySelectorAll('#props input[data-k]').forEach(i=>props[i.dataset.k]=i.value);const r=await bedrock.propsSet(props);msg(r.ok?'保存しました':'失敗: '+(r.error||''),r.ok)});
  on('bPropsReload',loadProps);
  on('bVer',async()=>{const r=await bedrock.versionCheck();$('#verRes').innerHTML=r.ok?`<div class="kv">最新<b>${esc(r.tag)}</b></div><a href="${r.url}" target="_blank">${r.url}</a>`:`<div class="msg err">確認失敗: ${esc(r.error)}</div>`;$('#ver').textContent='v0.1.0'});
}
async function loadLogs(){const r=await bedrock.logs();const el=$('#log');if(el){el.innerHTML=r.lines.map(esc).join('\n');el.scrollTop=el.scrollHeight}}
async function loadJson(name,elId,title){const r=await bedrock.listJson(name);const el=document.getElementById(elId);if(!el)return;
  const items=r.data||[];el.innerHTML=`<table><tr><th>#</th><th>name</th><th>xuid</th></tr>${items.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name||p.xuid||'-')}</td><td style="font-size:11px">${esc(p.xuid||'')}</td></tr>`).join('')}</table><p class="hint">${items.length}件 — 直接編集はJSONファイル（${esc(r.path)}）を参照</p>`}
async function loadBaks(){const r=await bedrock.backupList();const el=$('#baks');if(!el)return;
  el.innerHTML=r.items.length?r.items.map(n=>`<div class="kv">${esc(n)}</div>`).join(''):'<p class="hint">バックアップなし</p>';
  const sel=$('#bSel');if(sel)sel.innerHTML='<option value="">バックアップを選択</option>'+r.items.map(n=>`<option>${n}</option>`).join('')}
async function loadProps(){const r=await bedrock.propsGet();const el=$('#props');if(!el)return;
  if(!r.ok){el.textContent='server.properties を読み込めません: '+r.error;return}
  const keys=['server-name','gamemode','difficulty','max-players','server-port','online-mode','level-name','view-distance','tick-distance'];
  el.innerHTML=keys.map(k=>`<div class="row" style="margin-bottom:6px"><label style="flex:0 0 160px" class="hint">${k}</label><input data-k="${k}" value="${esc(r.props[k]||'')}"></div>`).join('')+`<p class="hint">${keys.length}項目を表示（全キーは ${esc(r.path)}）</p>`}
bedrock.onLog(l=>{const el=$('#log');if(el){el.textContent+=l+'\n';el.scrollTop=el.scrollHeight}});
refresh();setInterval(()=>{if(st.running)bedrock.status().then(s=>{st=s;$('#dot').className='dot'+(s.running?' on':'');$('#status').textContent=s.running?`running pid=${s.pid}`:'stopped'})},3000);
</script>
</body>
</html>
