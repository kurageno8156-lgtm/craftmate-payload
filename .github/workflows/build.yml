name: Build CraftMate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.4.0)'
        required: true
        default: '1.4.0'

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows ビルド（現行の唯一の正式リリース対象）
  # 現状: PowerShell スクリプト installer/Build-Release.ps1 が
  #       C# (Launcher/Setup/Updater/Uninstall/ScreenViewer) を
  #       csc.exe でコンパイルし、app_payload.zip + Setup.exe を生成する。
  # ============================================================
  build-windows:
    runs-on: windows-latest
    # 現状は手動実行のみ。タグ push 時の正式リリースは従来通りローカルの
    # Auto-Release.ps1 が担当する（CI での二重リリースを防ぐため）。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Build Windows installers (x64)
        shell: pwsh
        env:
          # コード署名（SmartScreen警告の緩和）。証明書を用意したら
          # GitHub Secrets に以下を登録すると自動署名される:
          #   CRAFTMATE_PFX_BASE64  … .pfx を base64 エンコードした文字列
          #   CRAFTMATE_PFX_PASSWORD … 証明書パスワード
          # 未設定の場合は署名なしでビルド（SmartScreen警告は出る）。
          CRAFTMATE_PFX_BASE64: ${{ secrets.CRAFTMATE_PFX_BASE64 }}
          CRAFTMATE_PFX_PASSWORD: ${{ secrets.CRAFTMATE_PFX_PASSWORD }}
        run: |
          # 既存のリリーススクリプトを呼び出す。
          # 注意: このスクリプトは GitHub Releases へのアップロードと
          #       git tag 作成も行うため、CI では payload 生成部分のみ
          #       分離することが望ましい（下記 TODO 参照）。
          .\installer\Build-Release.ps1 -Version ${{ inputs.version || github.ref_name }}

      # TODO(マルチアーキ):
      #   - x86 (32bit) ビルド: csc /platform:x86 + 32bit Node 同梱
      #   - ARM64 ビルド: csc /platform:anycpu + ARM64 Node 同梱
      #   - 現状の Build-Release.ps1 は単一アーキ前提のため、
      #     アーキ別に出力ディレクトリを分ける改修が必要。

      # - name: Upload Windows artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: craftmate-windows-x64
      #     path: |
      #       CraftMate_Setup.exe
      #       app_payload.zip
      #       Uninstall.exe

  # ============================================================
  # Linux ビルド（準備中プレースホルダー）
  # 必要な作業:
  #   1. better-sqlite3 等のネイティブモジュールを Linux 向けに
  #      npm rebuild / prebuilt 対応
  #   2. Launcher.cs / Updater.cs の C# 依存を除去または
  #      Avalonia / bash スクリプトへ置き換え
  #   3. AppImage / deb / rpm パッケージング（appimagetool, nfpm 等）
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    # 手動実行（workflow_dispatch）のみ。タグ push 時は Windows リリースを優先。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # Linux 向け prebuilt の取得 + 必要時ソースビルド（build-essential/python3 は ubuntu-latest に同梱）
      # craftmate-payload/ にステージングされる（Electron の extraResources が参照）
      - name: Build portable tarball (linux/x64)
        run: bash build-release.sh ${{ inputs.version || '1.4.0' }} linux x64

      # Electron デスクトップラッパー（AppImage + deb）
      # payload/dist/index.js を ELECTRON_RUN_AS_NODE で spawn し、
      # localhost:3000 をネイティブウィンドウに表示する。
      - name: Build Electron app (AppImage + deb, x64)
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage deb --x64 \
            -c.appImage.artifactName="CraftMate-linux-x64.AppImage" \
            -c.deb.artifactName="CraftMate-linux-x64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-linux-x64
          path: |
            craftmate-linux-x64.tar.gz
            electron/dist-installer/*.AppImage
            electron/dist-installer/*.deb

  # ARM64 Linux も同様に実行可能（self-hosted ARM runner が必要な場合あり）
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build portable tarball (linux/arm64)
        run: bash build-release.sh ${{ inputs.version || '1.4.0' }} linux arm64

      # arm64 runner では electron-builder 同梱の fpm (x86_64バイナリ) が動かないため
      # deb は生成せず AppImage のみビルドする。
      - name: Build Electron app (AppImage, arm64)
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage --arm64 \
            -c.appImage.artifactName="CraftMate-linux-arm64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-linux-arm64
          path: |
            craftmate-linux-arm64.tar.gz
            electron/dist-installer/*.AppImage
            electron/dist-installer/*.deb

  # ============================================================
  # macOS ビルド（準備中プレースホルダー）
  # 必要な作業:
  #   1. better-sqlite3 の macOS prebuilt 対応確認
  #   2. C# Launcher の macOS 代替（Swift/スクリプト）
  #   3. .app バンドル化 + hdiutil で .dmg 生成
  #   4. 署名・公証（Developer ID + notarytool）
  # ============================================================
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-13   # Intel
            arch: x64
            node-arch: x64
          - runner: macos-14   # Apple Silicon
            arch: arm64
            node-arch: arm64
    runs-on: ${{ matrix.runner }}
    # 手動実行（workflow_dispatch）のみ
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # macOS ランナーには Xcode CLT 同梱。better-sqlite3 は darwin 向け prebuilt を取得、
      # 無い場合はソースビルド（xcode-select --install 済み）。
      - name: Build portable tarball (macos/${{ matrix.arch }})
        run: bash build-release.sh ${{ inputs.version || '1.4.0' }} darwin ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-macos-${{ matrix.arch }}
          path: craftmate-darwin-${{ matrix.arch }}.tar.gz

  # ============================================================
  # リリース（タグ push 時のみ）
  # 命名規則メモ:
  #   - Windows 単体: v1.4.0（現行通り）
  #   - OS 別リリース: v1.4.0-linux / v1.4.0-macos / v1.4.0-android
  #   - 全OS同時: v1.4.0 に全アセット同梱も可
  # ============================================================
  release:
    needs: [build-windows] # build-linux / build-macos 有効化後に追加
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ビルド成果物を Release アセットとしてアップロードする処理をここに実装。
          # 例: gh release create ${{ github.ref_name }} CraftMate_Setup.exe --title "CraftMate ${{ github.ref_name }}"
          echo "Release assets upload TODO"
