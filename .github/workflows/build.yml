name: Build CraftMate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.4.0)'
        required: true
        default: '1.4.0'

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows ビルド（現行の唯一の正式リリース対象）
  # 現状: PowerShell スクリプト installer/Build-Release.ps1 が
  #       C# (Launcher/Setup/Updater/Uninstall/ScreenViewer) を
  #       csc.exe でコンパイルし、app_payload.zip + Setup.exe を生成する。
  # ============================================================
  build-windows:
    runs-on: windows-latest
    # 現状は手動実行のみ。タグ push 時の正式リリースは従来通りローカルの
    # Auto-Release.ps1 が担当する（CI での二重リリースを防ぐため）。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # OAuth クライアント情報を Secrets から生成（git 管理外のため CI では未存在）
      - name: Generate oauth-clients.json from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          cat > oauth-clients.json <<EOF
          {
            "google":    { "clientId": "${GOOGLE_CLIENT_ID}",    "clientSecret": "${GOOGLE_CLIENT_SECRET}" },
            "microsoft": { "clientId": "${MICROSOFT_CLIENT_ID}", "clientSecret": "${MICROSOFT_CLIENT_SECRET}" },
            "github":    { "clientId": "${GITHUB_CLIENT_ID}",    "clientSecret": "${GITHUB_CLIENT_SECRET}" },
            "discord":   { "clientId": "${DISCORD_CLIENT_ID}",   "clientSecret": "${DISCORD_CLIENT_SECRET}" }
          }
          EOF
          echo "oauth-clients.json generated (providers with clientId: $(grep -o '\"clientId\": \"[^\"]\{8,\}' oauth-clients.json | wc -l))"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # better-sqlite3 は prebuilds/ に win32-x64 バイナリを同梱しており
        # node-gyp ビルドは不要。windows-latest の VS 検出が失敗するため
        # install scripts をスキップし、必要な esbuild の postinstall のみ実行する。
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
        shell: bash

      - name: TypeScript build
        run: npm run build

      - name: Stage node.exe for payload
        # Build-Release.ps1 はプロジェクトルートの node.exe をペイロードに同梱する。
        # node.exe は .gitignore 対象のため、setup-node のものをコピーする。
        run: cp "$(dirname "$(which node)")/node.exe" ./node.exe
        shell: bash

      - name: Build Windows installers (x64)
        shell: pwsh
        env:
          # コード署名（SmartScreen警告の緩和）。証明書を用意したら
          # GitHub Secrets に以下を登録すると自動署名される:
          #   CRAFTMATE_PFX_BASE64  … .pfx を base64 エンコードした文字列
          #   CRAFTMATE_PFX_PASSWORD … 証明書パスワード
          # 未設定の場合は署名なしでビルド（SmartScreen警告は出る）。
          CRAFTMATE_PFX_BASE64: ${{ secrets.CRAFTMATE_PFX_BASE64 }}
          CRAFTMATE_PFX_PASSWORD: ${{ secrets.CRAFTMATE_PFX_PASSWORD }}
        run: |
          # 既存のリリーススクリプトを呼び出す。
          # 注意: このスクリプトは GitHub Releases へのアップロードと
          #       git tag 作成も行うため、CI では payload 生成部分のみ
          #       分離することが望ましい（下記 TODO 参照）。
          .\installer\Build-Release.ps1 -Version ${{ inputs.version || github.ref_name }}

      # TODO(マルチアーキ):
      #   - x86 (32bit) ビルド: csc /platform:x86 + 32bit Node 同梱
      #   - ARM64 ビルド: csc /platform:anycpu + ARM64 Node 同梱
      #   - 現状の Build-Release.ps1 は単一アーキ前提のため、
      #     アーキ別に出力ディレクトリを分ける改修が必要。

      # - name: Upload Windows artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: craftmate-windows-x64
      #     path: |
      #       CraftMate_Setup.exe
      #       app_payload.zip
      #       Uninstall.exe

  # ============================================================
  # Linux ビルド（準備中プレースホルダー）
  # 必要な作業:
  #   1. better-sqlite3 等のネイティブモジュールを Linux 向けに
  #      npm rebuild / prebuilt 対応
  #   2. Launcher.cs / Updater.cs の C# 依存を除去または
  #      Avalonia / bash スクリプトへ置き換え
  #   3. AppImage / deb / rpm パッケージング（appimagetool, nfpm 等）
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    # 手動実行（workflow_dispatch）のみ。タグ push 時は Windows リリースを優先。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Generate oauth-clients.json from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          cat > oauth-clients.json <<EOF
          {
            "google":    { "clientId": "${GOOGLE_CLIENT_ID}",    "clientSecret": "${GOOGLE_CLIENT_SECRET}" },
            "microsoft": { "clientId": "${MICROSOFT_CLIENT_ID}", "clientSecret": "${MICROSOFT_CLIENT_SECRET}" },
            "github":    { "clientId": "${GITHUB_CLIENT_ID}",    "clientSecret": "${GITHUB_CLIENT_SECRET}" },
            "discord":   { "clientId": "${DISCORD_CLIENT_ID}",   "clientSecret": "${DISCORD_CLIENT_SECRET}" }
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Linux 向け prebuilt の取得 + 必要時ソースビルド（build-essential/python3 は ubuntu-latest に同梱）
      # craftmate-payload/ にステージングされる（Electron の extraResources が参照）
      - name: Build portable tarball (linux/x64)
        run: bash build-release.sh ${{ inputs.version || '1.4.0' }} linux x64

      # Electron デスクトップラッパー（AppImage + deb）
      # payload/dist/index.js を ELECTRON_RUN_AS_NODE で spawn し、
      # localhost:3000 をネイティブウィンドウに表示する。
      - name: Build Electron app (AppImage + deb, x64)
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage deb --x64 \
            -c.appImage.artifactName="CraftMate-linux-x64.AppImage" \
            -c.deb.artifactName="CraftMate-linux-x64.deb"

      # アプリ内アップデートの SHA256 検証用チェックサムを生成する
      - name: Generate SHA256 checksums (x64)
        working-directory: electron/dist-installer
        run: |
          for f in *.AppImage *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-linux-x64
          path: |
            craftmate-linux-x64.tar.gz
            electron/dist-installer/*.AppImage
            electron/dist-installer/*.AppImage.sha256
            electron/dist-installer/*.deb
            electron/dist-installer/*.deb.sha256

  # ARM64 Linux も同様に実行可能（self-hosted ARM runner が必要な場合あり）
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Generate oauth-clients.json from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          cat > oauth-clients.json <<EOF
          {
            "google":    { "clientId": "${GOOGLE_CLIENT_ID}",    "clientSecret": "${GOOGLE_CLIENT_SECRET}" },
            "microsoft": { "clientId": "${MICROSOFT_CLIENT_ID}", "clientSecret": "${MICROSOFT_CLIENT_SECRET}" },
            "github":    { "clientId": "${GITHUB_CLIENT_ID}",    "clientSecret": "${GITHUB_CLIENT_SECRET}" },
            "discord":   { "clientId": "${DISCORD_CLIENT_ID}",   "clientSecret": "${DISCORD_CLIENT_SECRET}" }
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build portable tarball (linux/arm64)
        run: bash build-release.sh ${{ inputs.version || '1.4.0' }} linux arm64

      # arm64 runner では electron-builder 同梱の fpm (x86_64バイナリ) が動かないため
      # deb は生成せず AppImage のみビルドする。
      - name: Build Electron app (AppImage, arm64)
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage --arm64 \
            -c.appImage.artifactName="CraftMate-linux-arm64.AppImage"

      - name: Generate SHA256 checksums (arm64)
        working-directory: electron/dist-installer
        run: |
          for f in *.AppImage *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-linux-arm64
          path: |
            craftmate-linux-arm64.tar.gz
            electron/dist-installer/*.AppImage
            electron/dist-installer/*.AppImage.sha256
            electron/dist-installer/*.deb
            electron/dist-installer/*.deb.sha256

  # ============================================================
  # macOS ビルド（準備中プレースホルダー）
  # 必要な作業:
  #   1. better-sqlite3 の macOS prebuilt 対応確認
  #   2. C# Launcher の macOS 代替（Swift/スクリプト）
  #   3. .app バンドル化 + hdiutil で .dmg 生成
  #   4. 署名・公証（Developer ID + notarytool）
  # ============================================================
  build-macos:
    runs-on: macos-latest
    # 手動実行（workflow_dispatch）のみ
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Generate oauth-clients.json from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          cat > oauth-clients.json <<EOF
          {
            "google":    { "clientId": "${GOOGLE_CLIENT_ID}",    "clientSecret": "${GOOGLE_CLIENT_SECRET}" },
            "microsoft": { "clientId": "${MICROSOFT_CLIENT_ID}", "clientSecret": "${MICROSOFT_CLIENT_SECRET}" },
            "github":    { "clientId": "${GITHUB_CLIENT_ID}",    "clientSecret": "${GITHUB_CLIENT_SECRET}" },
            "discord":   { "clientId": "${DISCORD_CLIENT_ID}",   "clientSecret": "${DISCORD_CLIENT_SECRET}" }
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # arm64 (Apple Silicon) と x64 (Intel) の両方の .dmg を生成する。
      # payload はアーキ別に build-release.sh でステージングし、
      # electron-builder の extraResources (../craftmate-payload) に載せる。
      - name: Build macOS payloads and DMGs (arm64 + x64)
        shell: bash
        run: |
          set -e
          VERSION="${{ inputs.version || '1.4.0' }}"
          cd electron
          npm install --no-audit --no-fund
          cd ..
          for ARCH in arm64 x64; do
            echo "==> Building payload for darwin/$ARCH"
            SKIP_PAYLOAD_COPY=0 bash build-release.sh "$VERSION" darwin "$ARCH"
            (cd electron && npx electron-builder --mac dmg --${ARCH} \
              -c.mac.identity=null \
              -c.mac.artifactName="CraftMate-macos-${ARCH}.dmg")
          done
          ls -la electron/dist-installer/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-macos
          path: electron/dist-installer/*.dmg

  # ============================================================
  # リリース（タグ push 時のみ）
  # 命名規則メモ:
  #   - Windows 単体: v1.4.0（現行通り）
  #   - OS 別リリース: v1.4.0-linux / v1.4.0-macos / v1.4.0-android
  #   - 全OS同時: v1.4.0 に全アセット同梱も可
  # ============================================================
  release:
    # Linux/macOS のビルド成果物を GitHub Release に添付する。
    # Windows アセットはローカルの Auto-Release.ps1 が作成済みのため、
    # ここでは workflow_dispatch（version 入力あり）時のみ実行する。
    # macOS ジョブが失敗/キャンセルでも Linux アセットは添付する。
    needs: [build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: craftmate-*
          merge-multiple: false

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          # Auto-Release.ps1 が先にリリースを作成する想定。無ければ保険として作成。
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --title "CraftMate $TAG" --notes "CraftMate $TAG"
          fi
          find artifacts -type f | sort | while read -r f; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" -R "$REPO" --clobber
          done
