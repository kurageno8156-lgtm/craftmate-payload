name: Build BlockWhiz

on:
  push:
    tags:
      - 'v*'
    # auth-server の Docker イメージ検証を main への push 時にも実行する。
    # 他ジョブは workflow_dispatch / タグ条件でゲートされているため影響なし。
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.6.2)'
        required: true
        default: '1.6.2'
      publish_release:
        description: 'Create/update a GitHub Release with the built assets (explicit opt-in; leave false for verification builds)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows ビルド（現行の唯一の正式リリース対象）
  # 現状: PowerShell スクリプト installer/Build-Release.ps1 が
  #       C# (Launcher/Setup/Updater/Uninstall/ScreenViewer) を
  #       csc.exe でコンパイルし、app_payload.zip + Setup.exe を生成する。
  # ============================================================
  build-windows:
    runs-on: windows-latest
    # 現状は手動実行のみ。タグ push 時の正式リリースは従来通りローカルの
    # Auto-Release.ps1 が担当する（CI での二重リリースを防ぐため）。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # better-sqlite3 は prebuilds/ に win32-x64 バイナリを同梱しており
        # node-gyp ビルドは不要。windows-latest の VS 検出が失敗するため
        # install scripts をスキップし、必要な esbuild の postinstall のみ実行する。
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
        shell: bash

      - name: TypeScript build
        run: npm run build

      - name: Stage node.exe for payload
        # Build-Release.ps1 はプロジェクトルートの node.exe をペイロードに同梱する。
        # node.exe は .gitignore 対象のため、setup-node のものをコピーする。
        run: cp "$(dirname "$(which node)")/node.exe" ./node.exe
        shell: bash

      - name: Build Windows installers (x64)
        shell: pwsh
        env:
          # コード署名（SmartScreen警告の緩和）。証明書を用意したら
          # GitHub Secrets に以下を登録すると自動署名される:
          #   CRAFTMATE_PFX_BASE64  … .pfx を base64 エンコードした文字列
          #   CRAFTMATE_PFX_PASSWORD … 証明書パスワード
          # 未設定の場合は署名なしでビルド（SmartScreen警告は出る）。
          CRAFTMATE_PFX_BASE64: ${{ secrets.CRAFTMATE_PFX_BASE64 }}
          CRAFTMATE_PFX_PASSWORD: ${{ secrets.CRAFTMATE_PFX_PASSWORD }}
        run: |
          # リリーススクリプトを呼び出す。Release・タグ作成は行わない
          # （GitHub Release の公開はローカルの Auto-Release.ps1 が担当）。
          # 出力先をワークスペース内の専用フォルダーに固定し、
          # 後続の upload-artifact パスと一致させる。
          .\installer\Build-Release.ps1 -Version ${{ inputs.version || github.ref_name }} -OutputDirectory "${{ github.workspace }}\release-artifacts"

      # TODO(マルチアーキ):
      #   - x86 (32bit) ビルド: csc /platform:x86 + 32bit Node 同梱
      #   - ARM64 ビルド: csc /platform:anycpu + ARM64 Node 同梱
      #   - 現状の Build-Release.ps1 は単一アーキ前提のため、
      #     アーキ別に出力ディレクトリを分ける改修が必要。

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craftmate-windows-x64
          path: release-artifacts/*
          if-no-files-found: error

  # ============================================================
  # Linux ビルド（準備中プレースホルダー）
  # 必要な作業:
  #   1. better-sqlite3 等のネイティブモジュールを Linux 向けに
  #      npm rebuild / prebuilt 対応
  #   2. Launcher.cs / Updater.cs の C# 依存を除去または
  #      Avalonia / bash スクリプトへ置き換え
  #   3. AppImage / deb / rpm パッケージング（appimagetool, nfpm 等）
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    # 手動実行（workflow_dispatch）のみ。タグ push 時は Windows リリースを優先。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Linux 向け prebuilt の取得 + 必要時ソースビルド（build-essential/python3 は ubuntu-latest に同梱）
      # craftmate-payload/ にステージングされる（Electron の extraResources が参照）
      - name: Build portable tarball (linux/x64)
        run: bash build-release.sh ${{ inputs.version || '1.6.2' }} linux x64

      # Electron デスクトップラッパー（AppImage + deb）
      # payload/dist/index.js を ELECTRON_RUN_AS_NODE で spawn し、
      # localhost:3000 をネイティブウィンドウに表示する。
      - name: Build Electron app (AppImage + deb, x64)
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage deb --x64 \
            -c.appImage.artifactName="CraftMate-linux-x64.AppImage" \
            -c.deb.artifactName="CraftMate-linux-x64.deb"

      # アプリ内アップデートの SHA256 検証用チェックサムを生成する
      - name: Generate SHA256 checksums (x64)
        working-directory: electron/dist-installer
        run: |
          for f in *.AppImage *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-linux-x64
          path: |
            craftmate-linux-x64.tar.gz
            craftmate-linux-x64.tar.gz.sha256
            electron/dist-installer/*.AppImage
            electron/dist-installer/*.AppImage.sha256
            electron/dist-installer/*.deb
            electron/dist-installer/*.deb.sha256

  # ARM64 Linux も同様に実行可能（self-hosted ARM runner が必要な場合あり）
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build portable tarball (linux/arm64)
        run: bash build-release.sh ${{ inputs.version || '1.6.2' }} linux arm64

      # arm64 runner では electron-builder 同梱の fpm (x86_64バイナリ) が動かないため
      # deb は生成せず AppImage のみビルドする。
      - name: Build Electron app (AppImage, arm64)
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage --arm64 \
            -c.appImage.artifactName="CraftMate-linux-arm64.AppImage"

      - name: Generate SHA256 checksums (arm64)
        working-directory: electron/dist-installer
        run: |
          for f in *.AppImage *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-linux-arm64
          path: |
            craftmate-linux-arm64.tar.gz
            craftmate-linux-arm64.tar.gz.sha256
            electron/dist-installer/*.AppImage
            electron/dist-installer/*.AppImage.sha256
            electron/dist-installer/*.deb
            electron/dist-installer/*.deb.sha256

  # ============================================================
  # macOS ビルド（準備中プレースホルダー）
  # 必要な作業:
  #   1. better-sqlite3 の macOS prebuilt 対応確認
  #   2. C# Launcher の macOS 代替（Swift/スクリプト）
  #   3. .app バンドル化 + hdiutil で .dmg 生成
  #   4. 署名・公証（Developer ID + notarytool）
  # ============================================================
  build-macos:
    runs-on: macos-latest
    # 手動実行（workflow_dispatch）のみ
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # arm64 (Apple Silicon) と x64 (Intel) の両方の .dmg を生成する。
      # payload はアーキ別に build-release.sh でステージングし、
      # electron-builder の extraResources (../craftmate-payload) に載せる。
      - name: Build macOS payloads and DMGs (arm64 + x64)
        shell: bash
        run: |
          set -e
          VERSION="${{ inputs.version || '1.6.2' }}"
          cd electron
          npm install --no-audit --no-fund
          cd ..
          for ARCH in arm64 x64; do
            echo "==> Building payload for darwin/$ARCH"
            SKIP_PAYLOAD_COPY=0 bash build-release.sh "$VERSION" darwin "$ARCH"
            (cd electron && npx electron-builder --mac dmg --${ARCH} \
              -c.mac.identity=null \
              -c.mac.artifactName="CraftMate-macos-${ARCH}.dmg")
          done
          ls -la electron/dist-installer/*.dmg

      # DMG 内部検査: oauth-clients.json（Client Secret を含み得る）と
      # 実シークレットパターンが成果物に含まれないことを確認する。
      # 検出時はカウントのみ出力し、ファイル内容・シークレット値はログに出さない。
      - name: Inspect DMG contents for OAuth client secrets
        shell: bash
        run: |
          set -e
          FAIL=0
          for DMG in electron/dist-installer/*.dmg; do
            echo "==> Inspecting $(basename "$DMG")"
            MOUNT=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
            # .app 内の全ファイルを対象に検査
            OAUTH_COUNT=$(find "$MOUNT" -name 'oauth-clients.json' | wc -l | tr -d ' ')
            # 実シークレットの汎用パターン（Google OAuth / 非空 clientSecret / 既知ID形式）
            SECRET_COUNT=$( { grep -rlE 'GOCSPX-[A-Za-z0-9_-]{20,}|clientSecret"[[:space:]]*:[[:space:]]*"[^"]{16,}"' "$MOUNT" 2>/dev/null || true; } | wc -l | tr -d ' ')
            echo "    oauth-clients.json entries: $OAUTH_COUNT"
            echo "    files matching secret patterns: $SECRET_COUNT"
            if [ "$OAUTH_COUNT" != "0" ] || [ "$SECRET_COUNT" != "0" ]; then
              echo "    !! SECRET CONTAMINATION DETECTED in $DMG"
              FAIL=1
            fi
            hdiutil detach "$MOUNT" -quiet || true
            rm -rf "$MOUNT"
          done
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "All DMGs clean: no oauth-clients.json, no client secrets."

      - uses: actions/upload-artifact@v4
        with:
          name: craftmate-macos
          path: electron/dist-installer/*.dmg

  # ============================================================
  # Auth Server Docker イメージ検証（ローカルビルドのみ・push なし）
  # 目的: 開発PCに Docker がなくても CI 上で auth-server/Dockerfile の
  #       実ビルドとイメージ内容を検証する。
  # 実行タイミング: main への push、または workflow_dispatch。
  # 他ジョブ・Release とは needs 関係なし・成果物アップロードなし。
  # ============================================================
  build-auth-server-docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build auth-server image (local only, no push)
        run: docker build -t craftmate-auth-server:ci ./auth-server

      - name: Inspect image user and CMD
        run: |
          USER=$(docker image inspect craftmate-auth-server:ci --format '{{.Config.User}}')
          CMD=$(docker image inspect craftmate-auth-server:ci --format '{{json .Config.Cmd}}')
          echo "User: $USER"
          echo "Cmd:  $CMD"
          test "$USER" = "node" || { echo "FAIL: image must run as non-root user 'node'"; exit 1; }
          test "$USER" != "" && test "$USER" != "root" || { echo "FAIL: root user"; exit 1; }
          echo "$CMD" | grep -q 'dist/index.js' || { echo "FAIL: CMD must run dist/index.js"; exit 1; }

      - name: Verify image contents (dist, prod deps, no secrets/tests)
        run: |
          docker run --rm --entrypoint sh craftmate-auth-server:ci -c '
            set -e
            test -f /app/dist/index.js || { echo "FAIL: /app/dist/index.js missing"; exit 1; }
            test -d /app/node_modules || { echo "FAIL: node_modules missing"; exit 1; }
            test -d /app/node_modules/express || { echo "FAIL: prod dep express missing"; exit 1; }
            test -w /app/data || { echo "FAIL: /app/data not writable"; exit 1; }
            # 秘密情報・開発ファイルが含まれないこと
            # （ls の複数パターンは一部不一致でも exit!=0 になり検出漏れするため個別判定）
            for f in /app/.env /app/.env.* /app/*.pem /app/*.key /app/jwt-keys.json /app/oauth-clients.json; do
              if [ -e "$f" ]; then echo "FAIL: secret/env file present: $f"; exit 1; fi
            done
            if [ -d /app/tests ]; then echo "FAIL: /app/tests present"; exit 1; fi
            for f in /app/*.test.mjs /app/*.log; do
              if [ -e "$f" ]; then echo "FAIL: dev file present: $f"; exit 1; fi
            done
            if [ -d /app/src ]; then echo "FAIL: /app/src (TS source) present in runtime image"; exit 1; fi
            echo "image contents OK"
          '

      - name: Smoke test - start with dummy env and check health
        run: |
          # 失敗・タイムアウト・中断のいずれでもコンテナを確実に除去する。
          # ログは docker logs で都度取得するため rm -f で失われない。
          cleanup() { docker rm -f auth-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name auth-smoke \
            -e NODE_ENV=development \
            -e BIND_HOST=0.0.0.0 \
            -e PORT=8080 \
            -e AUTH_PUBLIC_URL=http://localhost:8080 \
            -e AUTH_DEV_INSECURE_HTTP=1 \
            -e PGLITE_DIR=/tmp/pglite-smoke \
            -e GOOGLE_CLIENT_ID=dummy-ci \
            -e GOOGLE_CLIENT_SECRET=dummy-ci \
            -e MAIL_PROVIDER=mock \
            -p 127.0.0.1:18080:8080 \
            craftmate-auth-server:ci
          # ヘルスチェック（PGlite 初期化を含む起動を最大60秒待機）
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ops/health >/tmp/health.json 2>/dev/null; then
              echo "health OK:"; cat /tmp/health.json; break
            fi
            if [ "$i" = "30" ]; then
              echo "FAIL: health check timed out"; docker logs auth-smoke; exit 1
            fi
            sleep 2
          done
          # SIGTERM による graceful shutdown を検証する。
          # docker stop の終了コードは SIGKILL フォールバックでも 0 になるため、
          # アプリが出力する "shutdown complete" ログの存在で判定する。
          # アプリ側の強制終了猶予は10秒。docker stop のデフォルト猶予も10秒だと
          # Docker が先に SIGKILL を送り "shutdown complete" 前に終了し得るため、
          # --time 15 でアプリ側の猶予を先に消化させる。
          docker stop --time 15 auth-smoke >/dev/null
          # shutdown complete が出るまで最大15秒待機（index.ts の猶予10秒+余裕）
          for i in $(seq 1 15); do
            if docker logs auth-smoke 2>&1 | grep -q "shutdown complete"; then
              echo "graceful shutdown confirmed"; break
            fi
            if [ "$i" = "15" ]; then
              echo "FAIL: 'shutdown complete' not found in logs"; docker logs auth-smoke; exit 1
            fi
            sleep 1
          done
          docker logs auth-smoke | tail -10
          echo "smoke test OK"

  # ============================================================
  # リリース（タグ push 時のみ）
  # 命名規則メモ:
  #   - Windows 単体: v1.6.2（現行通り）
  #   - OS 別リリース: v1.6.2-linux / v1.6.2-macos / v1.6.2-android
  #   - 全OS同時: v1.6.2 に全アセット同梱も可
  # ============================================================
  release:
    # Linux/macOS のビルド成果物を GitHub Release に添付する。
    # Windows アセットはローカルの Auto-Release.ps1 が作成済みのため、
    # ここでは workflow_dispatch（version 入力あり）時のみ実行する。
    # Windows x64 + Linux x64/ARM64 の全対象ビルドが成功した場合のみ Release を作成する。
    # macOS は署名・公証未完了のため対象外（ジョブは needs にも含めない）。
    # Release に添付するのは Linux アーティファクトのみ。
    # Windows アセットはローカルの Auto-Release.ps1 が作成・アップロードするため、
    # ここで craftmate-windows-x64 を --clobber で上書きしない（署名済み資産の保護）。
    needs: [build-windows, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    # Release 作成は publish_release=true を明示した場合のみ。
    # 通常のビルド検証（デフォルト false）では Release・タグを一切変更しない。
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: craftmate-*
          merge-multiple: false

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          # Auto-Release.ps1 が先にリリースを作成する想定。無ければ保険として作成。
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --title "BlockWhiz $TAG" --notes "BlockWhiz $TAG"
          fi
          # Linux アーティファクトのみをアップロード対象にする。
          # craftmate-windows-x64 は needs でビルド成功をゲートする目的で取得するが、
          # Release への添付は Auto-Release.ps1 が行う Windows 資産と重複するため除外。
          # craftmate-macos は今回のリリース対象外のため除外。
          find artifacts/craftmate-linux-x64 artifacts/craftmate-linux-arm64 -type f 2>/dev/null | sort | while read -r f; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" -R "$REPO" --clobber
          done
