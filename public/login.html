<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftMate — ログイン</title>
  <link rel="icon" type="image/x-icon" href="/app.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Noto Sans JP', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'MS Gothic', system-ui, -apple-system, 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
      background: radial-gradient(1200px 800px at 50% -10%, #14532d 0%, #0b0f14 55%);
      color: #e4e4e7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 440px; background: rgba(17,24,39,.92); border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,.5); backdrop-filter: blur(8px);
    }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo img { width: 44px; height: 44px; }
    .logo h1 { font-size: 22px; font-weight: 700; }
    .logo .sub { color: #a1a1aa; font-size: 13px; margin-top: 2px; }
    .lead { color: #a1a1aa; font-size: 14px; margin: 18px 0 24px; line-height: 1.7; }
    .provider-btn {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; margin-bottom: 10px;
      background: #1f2937; color: #e4e4e7; border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; text-align: left;
    }
    .provider-btn:hover { background: #273449; border-color: #34d399; }
    .provider-btn:disabled { opacity: .5; cursor: default; }
    .provider-btn .icon { width: 22px; text-align: center; font-size: 18px; }
    .status { margin-top: 16px; font-size: 13px; color: #a1a1aa; min-height: 20px; }
    .status.error { color: #f87171; }
    .status.ok { color: #4ade80; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; color: #52525b; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
    .local-form { display: grid; gap: 10px; }
    .local-form input {
      width: 100%; padding: 11px 12px; background: #0b0f14; color: #e4e4e7;
      border: 1px solid rgba(255,255,255,.12); border-radius: 8px; font-size: 14px;
    }
    .local-form input:focus { outline: none; border-color: rgba(16,185,129,.5); }
    .local-form .local-row { display: flex; gap: 8px; }
    .local-btn {
      flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .local-btn.primary { background: #10b981; color: #052e1b; }
    .local-btn.primary:hover { background: #34d399; }
    .local-btn.secondary { background: transparent; color: #a1a1aa; border: 1px dashed rgba(255,255,255,.2); }
    .local-btn.secondary:hover { color: #e4e4e7; border-color: rgba(255,255,255,.4); }
    .local-btn:disabled { opacity: .5; cursor: default; }
    .local-hint { font-size: 11px; color: #52525b; margin-top: 4px; }
    .note { margin-top: 18px; font-size: 11px; color: #52525b; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/app.ico" alt="CraftMate">
      <div>
        <h1>CraftMate</h1>
        <div class="sub">Minecraft 自律型 AI エージェント</div>
      </div>
    </div>
    <p class="lead">続行するにはアカウントでログインしてください。<br>ボタンを押すと各サービスのログイン画面が開きます。</p>
    <div id="providers"></div>
    <div class="divider">または</div>
    <form class="local-form" id="local-form" autocomplete="off">
      <input type="text" id="local-username" placeholder="ユーザー名" maxlength="32" required>
      <input type="password" id="local-password" placeholder="パスワード（8文字以上）" minlength="8" required>
      <div class="local-row">
        <button type="submit" class="local-btn primary" id="local-login-btn">内部アカウントでログイン</button>
        <button type="button" class="local-btn secondary" id="local-register-btn">アカウント作成</button>
      </div>
      <p class="local-hint">OAuth が使えない場合のフォールバックです。アカウント情報はこのPC内の暗号化DBに保存されます。</p>
    </form>
    <div class="status" id="status"></div>
    <p class="note">ログイン情報は AES-256-GCM で暗号化してローカルに保存され、次回起動時に自動でログインされます。</p>
  </div>
  <script src="/login.js"></script>
</body>
</html>
